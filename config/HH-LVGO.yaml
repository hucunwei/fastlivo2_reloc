common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # LidarToCamera 
  Rcl: [ -0.010986, -0.999937,  0.002338,
        -0.007770, -0.002253, -0.999967,
        0.999909, -0.011004, -0.007745]
  Pcl: [ -0.061281,  0.036577, -0.038252]
  
time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 6
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.05 # 0.2
  gyr_cov: 0.03 #0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1
  ba_bg_est_en: true

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "Grass01"
  pose_output_en: true


# # Prior-map localization (no mapping) mode.
# # Workflow: 1) run mapping (localization_en: false) and save the map;
# 2) copy the saved map to a SEPARATE file as the prior map;
# 3) set localization_en: true and prior_map_path to that file to localize.
localization:
  localization_en: false
  prior_map_path: "/home/hucunwei/study/fastlivo2/src/FAST-LIVO2/Log/pcd/hh-lvgo-01/after_optimization_downsampled.pcd"   # use a SEPARATE prior map file, NOT Log/pcd/voxel_map.pcd (it gets overwritten by every save!)   
  init_pos: [0.0, 0.0, 0.0]
  init_yaw: 0.0        # radians; NOTE: auto-overridden by Log/pcd/init_map_pose.txt (saved during mapping/optimization)
  sigma_num: 10.0      # matching gate multiplier (wider than mapping's 3 to tolerate initial pose error)
  # When localization_en is true, the system reads Log/pcd/init_map_pose.txt
  # (map_origin_lat map_origin_lon map_origin_alt yaw_rad) generated during the
  # mapping/optimization run. It overrides init_yaw with the saved heading and
  # uses lat/lon/alt as the RTK->ENU conversion origin so the localization frame
  # matches the optimized prior map exactly.

pcd_save:
  pcd_save_en: true
  map_save_en: true # Save voxel map & visual sparse map on exit (or via /laserMapping/save_map service)
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  dense_map_en: true    # true: also save the undownsampled map
  save_map_before_opt: true  # opt_enable=true: also save cloud_map_before_opt.pcd
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.


gps:
  gps_en: true
  debug_mode: false
  gps_time_offset: 0.0
  extrinsic_T: [0, 0, 0]
  gps_topic: "/ublox_driver/receiver_pvt"

opt:
  opt_enable: true
  sliding_window_en: false   # false: press Enter during mapping for one full-trajectory batch optimization
  load_data: false
  rtk_cov: 0.01
  livo2_RPY_cov: 0.00000001
  livo2_XYZ_cov: 0.001
  map_voxel_size: 0.10   # voxel leaf size [m] for cloud_map.pcd when optimization is on
  smoother_lag: 10.0     # fixed-lag window [s]; older keyframes are marginalized
  align_duration: 50.0   # RTK/SLAM alignment uses the first this many seconds
